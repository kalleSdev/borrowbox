spring:
  application:
    name: borrowbox

server:
  port: 8080

borrowbox:
  cors:
    # Vite's dev server, on both hostnames it answers to.
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.borrowbox: INFO
